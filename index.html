<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--Tells the browser how to read characters in the file-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Translates to look correct on other devices-->
    <title>Monopoly</title>
    <!--Browser tab-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Monopoly</h1>
    <!--On the actual page-->
    <div id="setup">
        <!-- for user to input the conditions of the game-->
        <label for="boardSize">Board size (10 - 50)</label>
        <input type="number" id="boardSize" min="10" max="50">
        
        <label for="numOfPlayers">Number of players (2 - 10)</label>
        <input type="number" id="numOfPlayers" min="2" max="10">

        <button id="startButton">Start Game</button>
    </div>

    <!--Board and Game areas start hidden only setup is seen upon loading-->
    <div id="board" class="hidden"></div>
    <!--Only appears when player lands on unowned property-->
    <div id="buy-prompt" class="hidden">
        <p id="buy-text"></p>
        <button id="buy-yes">Buy</button>
        <button id="buy-no">Skip</button>
    </div>

    <div id="player-info" class="hidden"></div>
    <div id="dice" class="hidden">
        <button id="rollButton">Roll Dice</button>
        <!--Adding a button to roll the dice--> 
    </div>
    <div id="messages" class="hidden"></div>
    <div id="actions" class="hidden"></div>
    <div id="winner" class="hidden"></div>
    <script src="script.js"></script>
</body>
</html>
